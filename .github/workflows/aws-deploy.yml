---
name: AWS Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        default: "staging"
        options:
          - staging
          - production
        required: true
        type: choice

env:
  NODE_VERSION: "24"
  AWS_ACCOUNT_ID: ${{ vars.AWS_PUBLIC_DATA_RELEASES_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
  STAGING_S3_BUCKET: s3://staging.volumeviewer.allencell.org
  PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }}
  PRODUCTION_S3_BUCKET: s3://volumeviewer.allencell.org

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
        with:
          node-version: ${{env.NODE_VERSION}}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # Do not cache when publishing to prevent cache pollution attacks

      - name: Install and Build
        run: npm ci && npm run s3-build

      - name: Upload build files
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: aws-deploy-files
          path: ./imageviewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the JWT and OIDC

    # Dynamically set the environment variable based on the input above:
    environment: ${{ github.event.inputs.environment }}

    steps:
      # Compute a short sha for use in the OIDC session name, which has a 64 character limit
      - name: Add SHORT_SHA env property with commit short sha
        run: echo "SHORT_SHA=`echo ${{ github.sha }} | cut -c1-8`" >> $GITHUB_ENV

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::${AWS_ACCOUNT_ID}:role/github_website_3d_viewer
          role-session-name: website_3d_cell_viewer-${SHORT_SHA}
          aws-region: ${AWS_REGION}
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SHORT_SHA: ${{ env.SHORT_SHA }}

      # Setup variables based on the staging or production environment
      - name: Set deployment variables based on environment
        run: |
          if [ "${ENVIRONMENT}" == "production" ]; then
            echo "S3_BUCKET=${PRODUCTION_S3_BUCKET}" >> $GITHUB_ENV
            echo "CLOUDFRONT_DISTRIBUTION_ID=${PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID}" >> $GITHUB_ENV
          elif [ "${ENVIRONMENT}" == "staging" ]; then
            echo "S3_BUCKET=${STAGING_S3_BUCKET}" >> $GITHUB_ENV
            echo "CLOUDFRONT_DISTRIBUTION_ID=${STAGING_CLOUDFRONT_DISTRIBUTION_ID}" >> $GITHUB_ENV
          else
            echo "Invalid environment specified"
            exit 1
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          STAGING_S3_BUCKET: ${{ env.STAGING_S3_BUCKET }}
          STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ env.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
          PRODUCTION_S3_BUCKET: ${{ env.PRODUCTION_S3_BUCKET }}
          PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID: ${{ env.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Download build artifacts
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427
        with:
          name: aws-deploy-files
          path: ./dist

      # Note that the command below will copy the files to the root of the S3 bucket e.g., s3://volumeviewer.allencell.org/
      # If you want to copy files to a S3 prefix / subdirectory, you would want something like ${{ env.S3_BUCKET }}/your_prefix below
      - name: Copy build files to S3 root
        run: aws s3 sync ./dist ${S3_BUCKET}
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
