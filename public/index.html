<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>
      const gtmId = "<%= JSON.stringify(process.env.WEBPACK_GTM_ID) %>";
      (function (w, d, s, l, i) {
        if (!i) {
          return;
        }
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", gtmId);
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vol-E</title>
    
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="description" content="A web-based viewer for multi-channel 3D microscopy data." />
    <meta name="keywords" content="Microscopy, biology, imaging, 3D, 3D data, OME-Zarr, zarr, volumetric data, volume rendering, data visualization" />
    <meta name="author" content="The cell science accelerator at the Allen Institute" />
    <!-- <meta name="version" content="%VITE_APP_VERSION%" /> -->

    <meta property="og:title" content="Vol-E" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allen Institute, Cell Science" />
    <meta property="og:url" content="https://vole.allencell.org/" />
    <meta property="og:url" content="https://volumeviewer.allencell.org/" />
    <meta property="og:url" content="https://vol-e.allencell.org/" />
    <meta property="og:description" content="A web-based viewer for multi-channel 3D microscopy data." />
    <meta property="og:locale" content="en_US" />
   <meta property="og:image" content="<%= require('./meta-image.png') %>"/>
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="660" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="A screenshot of the Vol-E web viewer, viewing a 3D volumetric microscopy image of a colony of cells. The cell nuclei are shown in white, and the brightfield image is shown in purple."
    />

    <!-- Twitter meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AllenInstitute" />
    <meta property="twitter:domain" content="allencell.org" />
    <meta property="twitter:url" content="https://vole.allencell.org/" />
    <meta name="twitter:title" content="Vol-E" />
    <meta
      name="twitter:description"
      content="A web-based viewer for multi-channel 3D microscopy data."
    />
    <meta name="twitter:image" content="<%= require('./meta-image.png') %>" />
    <meta
      name="twitter:image:alt"
      content="A screenshot of the Vol-E web viewer, viewing a 3D volumetric microscopy image of a colony of cells. The cell nuclei are shown in white, and the brightfield image is shown in purple."
    />
        
    <style>
      html {
        box-sizing: border-box;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-5J7562WW"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      >
      </iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="cell-viewer"></div>
  </body>
</html>
